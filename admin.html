<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>تعديل موقع ع الفرازة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a back-office form, calm and quick
   IDEA: the shop's price board, editable
   PICTURE: the lists themselves
   COLOUR and TYPE: brand green, orange accent, cream; Baloo Bhaijaan 2 + Cairo
   LAYOUT: one column of sections, sticky export button */
:root{color-scheme:light dark;--bg:light-dark(#f7f2e6,#0f1813);--card:light-dark(#fffdf8,#17231b);--ink:light-dark(#1b2a21,#eef3ec);--mut:light-dark(#5f6f64,#a3b3a8);--line:light-dark(#e7dfcc,#27362c);--g:#1f523e;--g2:light-dark(#1f523e,#9bd07f);--o:#f47b20;--soft:light-dark(#edf2e6,#1b2a21);--red:light-dark(#b3261e,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Cairo,system-ui,sans-serif;padding-bottom:110px}
header{background:var(--g);color:#fff;padding:16px}
header img{height:40px}
header p{margin:6px 0 0;opacity:.9;font-size:15px}
main{max-width:760px;margin:0 auto;padding:16px}
h2{font-family:"Baloo Bhaijaan 2",Cairo,sans-serif;font-size:24px;margin:22px 0 4px;color:var(--g2)}
.hint{color:var(--mut);font-size:14px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
label{display:block}label span{display:block;font-size:13px;color:var(--mut);font-weight:600;margin-bottom:2px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:inherit;min-height:44px}
textarea{min-height:84px;resize:vertical}
.full{grid-column:1/-1}
.btn{border:0;border-radius:12px;min-height:44px;padding:8px 16px;font:800 15px Cairo,sans-serif;cursor:pointer;background:var(--soft);color:var(--g2)}
.btn.o{background:var(--o);color:#fff}.btn.del{background:none;color:var(--red)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.top b{font-weight:800}
.foot{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px}
.foot .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.foot .in .btn{flex:1}
#out{display:none}#out.on{display:block}
#code{font:13px/1.4 ui-monospace,monospace;direction:ltr;text-align:left;min-height:220px}
ol{padding-inline-start:20px;margin:6px 0}
:focus-visible{outline:2px solid var(--o);outline-offset:1px}
</style>
</head>
<body>
<header><img src="logo-white.png" alt="ع الفرازة"><p>صفحة التعديل: غيّر الأسعار وضيف العروض، وبعدين اضغط "طلّع ملف البيانات".</p></header>
<main id="app"></main>
<div class="foot"><div class="in"><button class="btn o" id="gen">طلّع ملف البيانات (data.js)</button></div></div>
<script src="data.js"></script>
<script>
{
const D=JSON.parse(JSON.stringify(window.FARAZA||{}));
['specials','offers','products','delivery','reviews','brands'].forEach(k=>D[k]=D[k]||[]);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SCH={
  specials:{title:'عروض خاصة',hint:'بتظهر في قسم لوحده فوق العروض، وبتختفي لوحدها بعد تاريخ النهاية.',add:'+ عرض خاص',f:[['name','اسم العرض'],['price','السعر','n'],['oldPrice','السعر قبل العرض (اختياري)','n'],['ends','آخر يوم للعرض','d'],['items','محتوى العرض (كل صنف في سطر)','l']]},
  offers:{title:'العروض الأساسية',hint:'العروض اللي شغالة على طول.',add:'+ عرض',f:[['name','اسم العرض'],['price','السعر','n'],['tag','كلمة فوق الكارت (اختياري)'],['items','محتوى العرض (كل صنف في سطر)','l']]},
  products:{title:'المنيو',hint:'الأصناف وأسعارها.',add:'+ صنف',f:[['name','الصنف'],['sub','الوصف (مسلوق، متقطع…)'],['unit','الوحدة (كيلو، 500 جرام…)'],['price','السعر','n']]},
  delivery:{title:'أسعار التوصيل',hint:'المنطقة وسعر التوصيل ليها.',add:'+ منطقة',f:[['place','المنطقة'],['price','السعر','n']]},
  reviews:{title:'كلام العملاء',hint:'رسايل العملاء اللي بتظهر في الموقع (من غير أسماء).',add:'+ رسالة',f:[['tag','كلمة صغيرة (نضافة، طزاجة…)'],['text','الرسالة','t']]},
  brands:{title:'براندات مختارة',hint:'لو القائمة فاضية الموقع بيكتب "قريبًا".',add:'+ براند',f:[['name','اسم البراند'],['product','المنتج'],['unit','الوحدة'],['price','السعر (اختياري)','n'],['note','ليه اخترناه','t']]}
};
function field(k,i,[f,l,t]){const v=D[k][i][f];
  if(t==='l')return `<label class="full"><span>${l}</span><textarea data-k="${k}" data-i="${i}" data-f="${f}" data-t="l">${esc((v||[]).join('\n'))}</textarea></label>`;
  if(t==='t')return `<label class="full"><span>${l}</span><textarea data-k="${k}" data-i="${i}" data-f="${f}">${esc(v)}</textarea></label>`;
  return `<label><span>${l}</span><input data-k="${k}" data-i="${i}" data-f="${f}" data-t="${t||''}" ${t==='n'?'type="number" inputmode="decimal"':t==='d'?'type="date"':''} value="${esc(v??'')}"></label>`}
function draw(){
  document.getElementById('app').innerHTML=`<h2>بيانات عامة</h2><div class="card grid">
    <label><span>رقم الواتساب (دولي، من غير +)</span><input data-g="whatsapp" value="${esc(D.whatsapp)}" inputmode="tel"></label>
    <label><span>رقم الموبايل</span><input data-g="phone" value="${esc(D.phone)}" inputmode="tel"></label>
    <label><span>المنطقة</span><input data-g="area" value="${esc(D.area)}"></label>
    <label class="full"><span>عنوان مكان التجهيز</span><input data-g="address" value="${esc(D.address)}"></label>
    <label><span>لينك اللوكيشن (Google Maps)</span><input data-g="mapUrl" value="${esc(D.mapUrl)}" dir="ltr"></label>
    <label><span>لينك فيسبوك</span><input data-g="facebook" value="${esc(D.facebook)}" dir="ltr"></label>
    <label><span>عدد العملاء (بيظهر +)</span><input data-g="customers" value="${esc(D.customers)}" inputmode="numeric"></label>
    <label><span>لينك تيك توك</span><input data-g="tiktok" value="${esc(D.tiktok)}" dir="ltr"></label></div>`+
  Object.entries(SCH).map(([k,s])=>`<h2>${s.title}</h2><p class="hint">${s.hint}</p>`+D[k].map((it,i)=>`<div class="card"><div class="top"><b>${esc(it.name||it.tag||it.place||'جديد')}</b><span>
    ${i>0?`<button class="btn" data-up="${k}" data-i="${i}" aria-label="لفوق">↑</button>`:''}<button class="btn del" data-del="${k}" data-i="${i}">مسح</button></span></div>
    <div class="grid">${s.f.map(f=>field(k,i,f)).join('')}</div></div>`).join('')+`<button class="btn" data-add="${k}">${s.add}</button>`).join('')+
  `<div id="out" class="card" style="margin-top:20px"><h2 style="margin-top:0">ملف البيانات جاهز</h2>
    <ol class="hint"><li>اضغط "انسخ".</li><li>افتح ملف <b>data.js</b> على GitHub واضغط علامة القلم ✏️.</li><li>امسح كل اللي فيه، والصق الجديد، واضغط <b>Commit changes</b>.</li><li>الموقع بيتحدث خلال دقيقة أو اتنين.</li></ol>
    <textarea id="code" readonly></textarea><button class="btn o" id="copy" style="margin-top:8px;width:100%">انسخ</button></div>`}
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.g){D[t.dataset.g]=t.value;return}
  const {k,i,f,t:ty}=t.dataset;if(!k)return;
  D[k][i][f]=ty==='l'?t.value.split('\n').map(x=>x.trim()).filter(Boolean):ty==='n'?(t.value===''?undefined:Number(t.value)):t.value;
  if(f==='name')t.closest('.card').querySelector('.top b').textContent=t.value||'جديد'});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.add){const k=b.dataset.add;D[k].push(k==='specials'?{id:'s'+Date.now(),name:'',items:[],price:undefined,ends:''}:k==='offers'?{id:'o'+Date.now(),name:'',items:[],price:undefined}:k==='products'?{id:'p'+Date.now(),name:'',sub:'',unit:'كيلو',price:undefined}:k==='reviews'?{tag:'',text:''}:k==='delivery'?{place:'',price:undefined}:{name:'',product:'',note:''});draw()}
  else if(b.dataset.del){if(b.dataset.armed){D[b.dataset.del].splice(+b.dataset.i,1);draw()}else{b.dataset.armed=1;b.textContent='متأكد؟';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='مسح'}},3000)}}
  else if(b.dataset.up){const a=D[b.dataset.up],i=+b.dataset.i;[a[i-1],a[i]]=[a[i],a[i-1]];draw()}
  else if(b.id==='gen'){const d=new Date();D.updated=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const clean=k=>D[k].filter(x=>String(x.name||x.text||x.place||'').trim());
    const out={...D,specials:clean('specials'),offers:clean('offers'),products:clean('products'),reviews:clean('reviews'),delivery:clean('delivery'),brands:clean('brands')};
    document.getElementById('out').classList.add('on');document.getElementById('code').value='// بيانات موقع ع الفرازة — اتعملت من صفحة التعديل\nwindow.FARAZA = '+JSON.stringify(out,null,2)+';\n';
    document.getElementById('out').scrollIntoView({behavior:'smooth'})}
  else if(b.id==='copy'){const c=document.getElementById('code');try{await navigator.clipboard.writeText(c.value);b.textContent='اتنسخ ✓'}catch(_){c.select();b.textContent='اختار الكل وانسخ يدوي'}setTimeout(()=>b.textContent='انسخ',2500)}});
draw();
}
</script>
</body>
</html>
